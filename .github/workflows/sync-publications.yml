name: Sync publications and deploy site

on:
  schedule:
    # Weekly on Mondays at 12:17 UTC. GitHub schedules are best effort.
    - cron: '17 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publications-and-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.publications.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test publication sync
        run: python -m unittest discover -s tests -v
      - name: Fetch AIBM publications
        id: publications
        run: |
          python scripts/sync_publications.py
          if git diff --quiet -- js/content.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit publication changes
        if: steps.publications.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/content.js
          git commit -m "Update publications from AIBM profile"
          git push origin HEAD:main
      - name: Package static site
        if: steps.publications.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '_site/' --exclude '.git/' --exclude '.github/' \
            --exclude 'scripts/' --exclude 'tests/' --exclude '__pycache__/' \
            --exclude '.gitignore' --exclude '.DS_Store' --exclude 'README.md'
      - name: Upload site
        if: steps.publications.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy explicitly: GITHUB_TOKEN commits don't trigger a separate Pages build.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
